<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="Windows Tools host: an MCP client makes tool calls to the MCP server and a connector makes lease calls to lease control. Both reach the toolset, which holds the lease and runs one call at a time. Two swappable interfaces sit on its edge: execution runs commands in PowerShell inside a job object, and session reads the Windows session's identity and lock state.">
<style>
  svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #59636e; --node: #f6f8fa; --group: #f6f8fa80; --border: #d1d9e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --line: #9198a1; --node: #151b23; --group: #151b2380; --border: #3d444d }
  }
  .bg { fill: var(--bg) }
  .group { fill: var(--group); stroke: var(--border) }
  .isolated { fill: none; stroke: var(--muted); stroke-dasharray: 5 4 }
  .node { fill: var(--node); stroke: var(--border) }
  .name { fill: var(--fg); font-size: 14px; text-anchor: middle; dominant-baseline: central }
  .title { fill: var(--muted); font-size: 13px }
  .note { fill: var(--muted); font-size: 12px }
  .flow { fill: var(--fg); font-size: 12px }
  .edge { stroke: var(--line); stroke-width: 1.2; fill: none; marker-end: url(#to) }
  .both { marker-start: url(#from) }
  .optional { stroke-dasharray: 5 4 }
  .head { fill: var(--line) }
</style>
<defs>
  <marker id="to" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0,0.5 L8,4 L0,7.5 Z"/></marker>
  <marker id="from" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M8,0.5 L0,4 L8,7.5 Z"/></marker>
</defs>
<rect class="bg" width="760" height="580"/>
<rect class="node" x="170" y="30" width="160" height="42" rx="6"/>
<text class="name" x="250.0" y="51.0">MCP client</text>
<rect class="node" x="430" y="30" width="160" height="42" rx="6"/>
<text class="name" x="510.0" y="51.0">Connector</text>
<rect class="group" x="100" y="120" width="560" height="290" rx="8"/>
<text class="title" x="114" y="142">Host</text>
<rect class="node" x="170" y="160" width="160" height="42" rx="6"/>
<text class="name" x="250.0" y="181.0">MCP server</text>
<rect class="node" x="430" y="160" width="160" height="42" rx="6"/>
<text class="name" x="510.0" y="181.0">Lease control</text>
<rect class="node" x="250" y="262" width="260" height="42" rx="6"/>
<text class="name" x="380.0" y="283.0">Toolset</text>
<rect class="node" x="170" y="390" width="160" height="40" rx="6"/>
<text class="name" x="250.0" y="410.0">Execution</text>
<rect class="node" x="430" y="390" width="160" height="40" rx="6"/>
<text class="name" x="510.0" y="410.0">Session</text>
<rect class="isolated" x="170" y="510" width="160" height="44" rx="8"/>
<text class="title" x="250.0" y="532.0" text-anchor="middle" dominant-baseline="central">PowerShell</text>
<rect class="isolated" x="430" y="510" width="160" height="44" rx="8"/>
<text class="title" x="510.0" y="532.0" text-anchor="middle" dominant-baseline="central">Windows session</text>
<path class="edge both" d="M250,72 L250,160"/>
<text class="flow" x="258" y="100">tool calls</text>
<path class="edge both" d="M510,72 L510,160"/>
<text class="flow" x="518" y="100">lease calls</text>
<path class="edge both" d="M290,202 L290,262"/>
<text class="flow" x="298" y="237">describe, exec.run</text>
<path class="edge both" d="M470,202 L470,262"/>
<text class="flow" x="478" y="237">resume, heartbeat, takeover</text>
<path class="edge both" d="M290,304 L290,390"/>
<text class="flow" x="298" y="351">commands, output</text>
<path class="edge both" d="M470,304 L470,390"/>
<text class="flow" x="478" y="351">identity, lock state</text>
<path class="edge both" d="M250,430 L250,510"/>
<text class="flow" x="258" y="474">job object</text>
<path class="edge both" d="M510,430 L510,510"/>
<text class="flow" x="518" y="474">Win32</text>
</svg>
