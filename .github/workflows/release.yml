name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: GitHub release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The executable the tests built.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-tools-host
          path: dist
      # The notes are the annotated tag's message.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/windows-tools-host.exe
          --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
